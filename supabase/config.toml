project_id = "savorseek-local"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[edge_runtime]
enabled = true
policy = "oneshot"
inspector_port = 8083

[functions.agent]
enabled = true
verify_jwt = true
entrypoint = "./functions/agent/index.ts"

# verify_jwt 只对 supabase CLI 的本地 functions serve 生效。自建实例上 Kong 只做
# key-auth（校验 anon key），edge-runtime 的 VERIFY_JWT 对 main 服务无效，因此
# places-search 在函数代码内用 auth.getUser() 自行校验用户身份。
[functions.places-search]
enabled = true
verify_jwt = true
entrypoint = "./functions/places-search/index.ts"
